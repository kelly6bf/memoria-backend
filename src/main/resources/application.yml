server:
  tomcat:
    mbeanregistry:
      enabled: true

spring:
  application:
    name: memoria-spring-boot-app

  profiles:
    active: local

  jpa:
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health
      base-path: /api/actuator

decorator:
  datasource:
    p6spy:
      enable-logging: false
